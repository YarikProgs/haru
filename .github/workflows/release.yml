name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  java:
    name: Build Java artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Compute version from release tag
        id: ver
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
          fi
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}

      - name: Build jar, sources jar and cli (shadow) jar
        run: |
          args=(build shadowJar)
          if [ -n "$VERSION" ]; then args+=("-PreleaseVersion=$VERSION"); fi
          ./gradlew "${args[@]}"
        env:
          VERSION: ${{ steps.ver.outputs.version }}

      - name: Upload Java artifacts
        uses: actions/upload-artifact@v4
        with:
          name: java
          path: build/libs/*.jar
          if-no-files-found: error

  vscode:
    name: Build VS Code extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Compute version from release tag
        id: ver
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
          fi
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}

      - name: Copy language server jar into the extension
        run: |
          args=(":haru-language-server:copyToExt")
          if [ -n "$VERSION" ]; then args+=("-PreleaseVersion=$VERSION"); fi
          ./gradlew "${args[@]}"
        env:
          VERSION: ${{ steps.ver.outputs.version }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Sync extension version with the release tag
        if: steps.ver.outputs.version != ''
        working-directory: vscode-extension
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version
        env:
          VERSION: ${{ steps.ver.outputs.version }}

      - name: Install dependencies
        working-directory: vscode-extension
        run: npm ci

      - name: Compile TypeScript
        working-directory: vscode-extension
        run: npm run compile

      - name: Package VSIX
        working-directory: vscode-extension
        run: npx vsce package

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: vscode-extension
          path: vscode-extension/*.vsix
          if-no-files-found: error

  publish:
    name: Attach artifacts to the release
    if: github.event_name == 'release'
    needs: [java, vscode]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Upload assets to the release
        run: gh release upload "$RELEASE_TAG" dist/* --clobber
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
